<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ person.name }} - CV</title>
<style>
  *, *:after, *:before {
    box-sizing: border-box;
  }

  :root {
    --page-width: 210mm;
    --page-height: 297mm;
    --page-margin: 12mm;
    --border-color: #d8d8d8;
    --muted: #555;
    --text: #151515;
    --content-gap: 5mm;
    --section-gap: 4.2mm;
    --item-gap: 2.8mm;
  }

  body {
    margin: 0;
    padding: 18px 0;
    background: #dedede;
    color: var(--text);
  }

  [hidden] {
    display: none !important;
  }

  h1, h2, h3, p {
    margin: 0;
  }

  ul {
    margin: 1.2mm 0 0;
    padding-left: 5mm;
  }

  li + li {
    margin-top: .8mm;
  }

  .pages {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .page {
    width: var(--page-width);
    height: var(--page-height);
    padding: var(--page-margin);
    background: white;
    box-shadow: 0 0 8px rgba(0,0,0,.15);
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }

  .page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .content {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--content-gap);
  }

  {{ style }}

  @page {
    size: A4;
    margin: 0;
  }

  @media print {
    body {
      background: white;
      padding: 0;
    }

    .pages {
      gap: 0;
    }

    .page {
      box-shadow: none;
      margin: 0;
    }
  }
</style>
</head>
<body class="ll-body">
<main id="source" hidden>
  {{ content | safe }}
</main>
<div class="pages" id="pages">
</div>
<script>
  window.resumeFormatterReady = false;
  window.resumeFormatterSource = null;

  function pageOverflow(page) {
    const content = page.querySelector(".content");
    return content.scrollHeight > content.clientHeight + 1;
  }

  function createPage() {
    const page = document.createElement("article");
    page.className = "page";
    const content = document.createElement("div");
    content.className = "content";
    page.appendChild(content);
    document.getElementById("pages").appendChild(page);
    return page;
  }

  function annotateSectionTree(section) {
    section.setAttribute("data-ll-path", "root");
    section.setAttribute("data-ll-index", "-1");

    function visit(node) {
      Array.from(node.children).forEach((child, index) => {
        const parentPath = node.getAttribute("data-ll-path");
        child.setAttribute("data-ll-path", `${parentPath}.${index}`);
        child.setAttribute("data-ll-index", String(index));
        visit(child);
      });
    }

    visit(section);
  }

  function cleanupSectionTree(node) {
    node.removeAttribute("data-ll-path");
    node.removeAttribute("data-ll-index");
    Array.from(node.children).forEach(cleanupSectionTree);
  }

  function isSplitItem(node) {
    return node.classList.contains("item") && !node.querySelector(".item");
  }

  function hasSplitItems(node) {
    return Array.from(node.children).some((child) => isSplitItem(child) || hasSplitItems(child));
  }

  function cloneSectionFragment(node, selectedItemPaths, includeStaticContent) {
    if (isSplitItem(node)) {
      return selectedItemPaths.has(node.getAttribute("data-ll-path")) ? node.cloneNode(true) : null;
    }

    const clone = node.cloneNode(false);

    Array.from(node.children).forEach((child) => {
      if (isSplitItem(child)) {
        if (selectedItemPaths.has(child.getAttribute("data-ll-path"))) {
          clone.appendChild(child.cloneNode(true));
        }
        return;
      }

      if (hasSplitItems(child)) {
        const childClone = cloneSectionFragment(child, selectedItemPaths, includeStaticContent);
        if (childClone && childClone.children.length) {
          clone.appendChild(childClone);
        }
        return;
      }

      if (includeStaticContent) {
        clone.appendChild(child.cloneNode(true));
      }
    });

    return clone;
  }

  function splitItems(section) {
    return Array.from(section.querySelectorAll(".item")).filter(isSplitItem);
  }

  function buildSectionPart(section, items, includeStaticContent) {
    const selectedItemPaths = new Set(items.map((item) => item.getAttribute("data-ll-path")));
    const part = cloneSectionFragment(section, selectedItemPaths, includeStaticContent);
    cleanupSectionTree(part);
    return part;
  }

  function appendSection(section, page, content) {
    const wholeSection = section.cloneNode(true);
    cleanupSectionTree(wholeSection);
    content.appendChild(wholeSection);

    if (!pageOverflow(page)) {
      return { page, content };
    }

    wholeSection.remove();
    const items = splitItems(section);

    if (!items.length) {
      page = createPage();
      content = page.querySelector(".content");
      content.appendChild(wholeSection);
      return { page, content };
    }

    let index = 0;
    while (index < items.length) {
      let fittedCount = 0;

      for (let end = index; end < items.length; end += 1) {
        const candidate = buildSectionPart(section, items.slice(index, end + 1), index === 0);
        content.appendChild(candidate);

        if (pageOverflow(page)) {
          candidate.remove();
          break;
        }

        candidate.remove();
        fittedCount = end - index + 1;
      }

      if (fittedCount === 0) {
        const emptyPage = content.children.length === 0;
        if (!emptyPage) {
          page = createPage();
          content = page.querySelector(".content");
          continue;
        }

        const forcedPart = buildSectionPart(section, [items[index]], index === 0);
        content.appendChild(forcedPart);
        index += 1;
      } else {
        const finalPart = buildSectionPart(section, items.slice(index, index + fittedCount), index === 0);
        content.appendChild(finalPart);
        index += fittedCount;
      }

      if (index < items.length) {
        page = createPage();
        content = page.querySelector(".content");
      }
    }

    return { page, content };
  }

  function paginate() {
    const pages = document.getElementById("pages");
    const header = window.resumeFormatterSource.header.cloneNode(true);
    const sections = window.resumeFormatterSource.sections;

    pages.innerHTML = "";
    let page = createPage();
    let content = page.querySelector(".content");
    content.appendChild(header);

    sections.forEach((section) => {
      ({ page, content } = appendSection(section, page, content));
    });
  }

  window.resumeFormatterLayout = function() {
    if (window.resumeFormatterReady) {
      return;
    }

    if (!window.resumeFormatterSource) {
      const source = document.getElementById("source");
      const sections = Array.from(source.querySelectorAll("[ll-section]")).map((section) => {
        const clone = section.cloneNode(true);
        annotateSectionTree(clone);
        return clone;
      });
      window.resumeFormatterSource = {
        header: source.querySelector("[ll-header]").cloneNode(true),
        sections
      };
    }

    document.body.classList.remove("compact");
    paginate();
    if (document.querySelectorAll(".page").length === 1) {
      window.resumeFormatterReady = true;
      return;
    }

    document.body.classList.add("compact");
    paginate();
    window.resumeFormatterReady = true;
  };

  window.addEventListener("load", window.resumeFormatterLayout);
</script>
</body>
</html>
