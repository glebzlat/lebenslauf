<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ person.name }} - CV</title>
<style>
  *, *:after, *:before {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    font-size: 100%;
    font: inherit;
    vertical-align: baseline;
  }

  /* HTML5 display-role reset for older browsers */
  article, aside, details, figcaption, figure,
  footer, header, hgroup, menu, nav, section {
    display: block;
  }

  body {
    line-height: 1;
    background-color: #eaeaea;
  }

  ol, ul {
    list-style: none;
  }

  blockquote, q {
    quotes: none;
  }

  blockquote:before, blockquote:after,
  q:before, q:after {
    content: '';
    content: none;
  }

  table {
    border-collapse: collapse;
    border-spacing: 0;
  }

  .pagedjs_pagebox {
    background-color: #fff;
  }

  .pagedjs_pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1cm;
    padding: 1cm 0 1cm 0;
  }

  {{ style }}
</style>
</head>
<body class="ll-body">
<main class="document">
  <article class="sheet" id="sheet">
    {{ content | safe }}
  </article>
  <div class="page-guides" id="page-guides" aria-hidden="true"></div>
</main>
<!-- <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>-->
<script src="paged.polyfill.min.js"></script>
</body>
</html>
